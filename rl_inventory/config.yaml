# ============================================================
# config.yaml - Cau hinh du an IPPO Inventory  (PHIEN BAN v2 + v3)
# Cac thay doi so voi ban cu duoc danh dau [V2-n]; xem
# pham_vi_khoa_luan.md muc 9 de biet ly do tung thay doi.
# [V3-1] Chia 3 mien du lieu train/val/test (thay vi 2 mien train/test).
# [V3-2] Chi phi thieu hang co the lay tu gia ban that cua M5 (sell_prices.csv)
#        thay vi hang so cp_th dung chung. Xem pham_vi_khoa_luan.md muc 3.5 "Chi phi thieu
#        hang theo gia that" de biet chi tiet + gia dinh kinh te.
# ============================================================

seed: 42

paths:
  data_dir:       "data/processed"
  raw_dir:        "data/raw"
  log_dir:        "runs"
  checkpoint_dir: "checkpoints"
  results_dir:    "results"

env:
  # [V2-20] 10 kho x 30 SKU = 300 cap (truoc: 10 x 50 = 500).
  n_warehouses:   10
  n_skus:         30
  episode_length: 365
  lookback:       7
  lead_time_min:  1
  lead_time_max:  3
  warehouse_capacity: auto
  capacity_cover_days: 5.0
  initial_cover_days:  3.0

  cp_lk:  1.0     # chi phi luu kho / don vi / ngay
  cp_th:  10.0    # chi phi thieu hang / don vi - DUNG KHI use_real_price_stockout=false
  cp_dh:  5.0     # chi phi dat hang / lan dat
  pt_tk:  5.0     # phat tran kho / don vi bi tu choi nhap
  phi_dv: 3.0     # he so phat muc phuc vu
  muc_dv: 0.85    # nguong fill rate muc tieu (beta)

  # [V3-2] Chi phi thieu hang theo GIA BAN THAT cua tung cap (M5 sell_prices.csv),
  # thay vi hang so cp_th dung chung cho ca 300 cap. Cong thuc:
  #   cp_th_pair = max(gia_ban_trung_binh(cap) * margin_ratio, cp_th_min)
  # margin_ratio la GIA DINH (M5 khong cong bo gia von) - dat 0.3 nghia la coi
  # thieu 1 don vi hang = mat 30% gia ban do la loi nhuan bien.
  # [P0-3] TAT cho THI NGHIEM CHINH: M5 khong cong bo gia von/chi phi that
  # cua Walmart, nen goi ket qua bang tien "that" (USD) la mot khang dinh
  # qua muc dua tren mot gia dinh (margin_ratio) khong kiem chung duoc. Thi
  # nghiem chinh dung hang so cp_th chung cho moi cap, bao cao bang "don vi
  # chi phi mo phong chuan hoa" thay vi USD. Tin hieu gia trong quan sat la
  # mot co RIENG (include_price_signal, dang tat -> quan sat 43 chieu).
  # Doi true de bat lai lam ablation rieng (khong dung cho ket qua chinh).
  use_real_price_stockout: false
  margin_ratio: 0.3
  cp_th_min:    0.5

  fill_rate_window: 30
  obs_cover_days:   20.0
  min_mean_demand:  0.05

  # [P0-7] Truoc day self.price_signal_dim = 1 bat cu khi nao
  # price_series.npy/price_per_pair.npy TON TAI, bat ke co dinh dat
  # su dung gia that hay khong (xem [V3-4] trong env/inventory_env.py) ->
  # obs_per_pair am tham thanh 44 thay vi 43 ngay khi cac file gia duoc
  # tao ra o buoc tien xu ly, MA KHONG co dong flag nao trong config phan
  # anh dieu do. Chuong 3 cua bao cao mo ta kien truc quan sat 43 chieu
  # (Bang doi chieu bien trang thai, Muc 3.1.2) KHONG bao gom tin hieu
  # giam gia nay. Dat false de giu dung kien truc 43 chieu da tai lieu
  # hoa; doi true CHI KHI da cap nhat lai Chuong 3 (them dac trung, sua
  # cong thuc obs_per_pair, sua bang doi chieu) cho khop.
  include_price_signal: false

  # [V2-2] Chuan hoa phan thuong theo tung cap (cp_th*mean_demand + cp_dh).
  # Dat false de chay ablation "khong chuan hoa" - se thay lai hien tuong
  # khong hoi tu, rat dang dua vao Chuong 4.
  normalize_reward_per_pair: true
  reward_scale: 1.0

  # [P2-2] Cach dinh co phat muc phuc vu (SLA 85%) cho tung cap:
  #   "demand"     : phi*cp_th*mean_demand*hut  (ban cu - ket qua 3 seed x 1000
  #                  episode dau tien). SKU ban cham bi phat rat nhe -> tac tu hy
  #                  sinh chung (39% cap duoi 85%, xem policy_behavior.json).
  #   "normalized" : phi*(cp_th*mean_demand + cp_dh)*hut -> sau chuan hoa theo
  #                  cap, MOI cap chiu cung muc phat phi*hut. CAU HINH CHINH MOI.
  service_penalty_mode: normalized
  # [P2-3] Khoi tao lich su cau bang du lieu that truoc start_day (khong de 0).
  warm_start_history: false
  # [P2-5] Tat nhom dac trung (dat = 0), vd [calendar] hoac [warehouse] - ablation.
  obs_drop: []
  # [P2-4] Them 2 dac trung lich co tinh du bao (so ngay toi su kien ke tiep).
  include_event_lookahead: false
  # [P2-1] Chi dung tap con SKU (thi nghiem hold-out). null = ca 30 SKU.
  sku_indices: null
  # [P3-1] "local": moi tac tu nhan phan thuong cuc bo cua cap minh (chinh).
  #        "global": moi tac tu nhan cung phan thuong cua ca mang (ablation RQ3).
  reward_mode: local
  # [P3-2] Danh gia cuoi tren TOAN BO mien test [1450, 1941) = 491 ngay, nhu
  # cau co dinh, chi lap hat giong thoi gian giao hang (khong chong lan cua so).
  test_full_horizon: true

  # [V3-1] 3 mien rieng biet, khong chong lan: train [0,split_day),
  # val [split_day,val_day) dung de chon best_model trong luc train,
  # test [val_day, het du lieu) CHI dung 1 lan de bao cao ket qua cuoi.
  # Mien test GIU NGUYEN [1450, 1941) nhu ban v2 de cac ket qua da co van
  # so sanh duoc; mien val duoc "cat" ra tu phan truoc do la train cu.
  split_day: 1050
  val_day:   1450

  use_relative_orders: true
  order_multipliers: [0.0, 0.5, 1.0, 2.0, 3.0, 5.0]
  order_levels:      [0, 10, 20, 30, 40, 50]

preprocess:
  stores:     ["CA_1", "CA_2", "CA_3", "CA_4", "TX_1", "TX_2", "TX_3", "WI_1", "WI_2", "WI_3"]
  n_skus:     30
  sku_selection: "stratified"
  min_mean_demand: 0.2

ppo:
  # [V2-22] n_steps 2048 -> 1024: cap nhat thuong xuyen hon, van con
  # 1024 x 300 = 307.200 mau moi lan update (thua du cho PPO).
  n_steps:         1024
  ppo_epochs:      4
  mini_batch_size: 16384  
  # [V2-8] Actor va critic la hai mang rieng nen lr khong con "ganh" nhau.
  lr_actor:        3.0e-4
  lr_critic:       1.0e-3
  gamma:           0.99
  gae_lambda:      0.95
  clip_eps:        0.2
  ent_coef:        0.02
  ent_coef_end:    0.002
  anneal_ent:      true
  vf_coef:         0.5
  max_grad_norm:   0.5
  hidden_dim:      128
  anneal_lr:       true
  target_kl:       0.02
  use_value_norm:  true       # [V2-10]
  clip_value_loss: true       # [V2-11]
  eval_every_episodes: 25
  eval_n_episodes:     2
  # [P0-5] Nguong fill rate de mot checkpoint duoc coi la "kha thi"
  # (feasible): chi nhung checkpoint dat >= muc_dv moi duoc xet chon theo
  # chi phi thap nhat. Truoc la 0.0 (moi checkpoint deu "kha thi"), khong
  # khop voi rang buoc that su cua bai toan (fill rate >= 85%).
  min_fill_to_save:    0.85
  normalize_adv_per_pair: true
  # [P2-7] true = Actor/Critic dung chung than mang + 1 optimizer (kien truc v1)
  # - CHI dung cho ablation, khong dung cho ket qua chinh.
  shared_trunk: false
  total_episodes: 4000

eval:
  n_episodes: 30
  seed:       1000
  log_cost_breakdown: true
  compare_baselines: ["eoq", "s_S", "newsvendor"]

# ============================================================
# CAC CO ABLATION (doi gia tri roi chay lai train.py, khong can sua code):
#   normalize_reward_per_pair : true/false  -> anh huong lon nhat toi hoi tu
#   normalize_adv_per_pair    : true/false
#   use_value_norm            : true/false
#   anneal_ent                : true/false
#   use_relative_orders       : true/false
#   capacity_cover_days       : so thuc     -> do chat cua rang buoc ghep noi
#   phi_dv                    : so thuc     -> do nhay he so phat service-level
# Moi lan chi doi 1 co, giu nguyen seed.
# ============================================================
