# ============================================================
# config.yaml — Cấu hình tập trung cho RL Inventory
# Tất cả hyperparameter, đường dẫn và seed được định nghĩa
# tại đây. CLI args trong main.py có thể override từng giá trị.
# ============================================================

# --- Hạt giống ngẫu nhiên (Reproducibility) ---
seed: 42

# --- Đường dẫn ---
paths:
  data_dir:       "data/processed"   # thư mục chứa demand_data.npy + env_config.json
  raw_dir:        "data/raw"         # thư mục chứa file M5 thô
  log_dir:        "runs"             # thư mục log TensorBoard
  checkpoint_dir: "checkpoints"      # thư mục lưu checkpoint .pth
  results_dir:    "results"          # thư mục xuất biểu đồ và CSV

# --- Cấu hình môi trường (Inventory Env) ---
env:
  n_warehouses:      2
  n_skus:            30
  episode_length:    112          # 16 tuần × 7 ngày
  lookback:          7            # cửa sổ lịch sử nhu cầu (ngày)
  lead_time_min:     1
  lead_time_max:     3
  max_inventory:     500
  initial_inventory: 100
  holding_cost:      1.0          # h: chi phí lưu kho / đơn vị / ngày
  stockout_cost:     10.0         # p: chi phí thiếu hàng / đơn vị
  ordering_cost:     50.0         # K: chi phí cố định / lần đặt hàng
  overflow_penalty:  5.0
  order_levels:      [0, 10, 20, 30, 40, 50]

# --- Cấu hình tiền xử lý dữ liệu ---
preprocess:
  stores:     ["CA_1", "TX_1"]    # các cửa hàng M5 làm nhà kho
  n_skus:     30
  chunk_size: 5000                # số dòng đọc mỗi chunk (tiết kiệm RAM)

# --- Hyperparameter huấn luyện ---
train:
  episodes:     1000
  hidden_dim:   256
  batch_size:   128               # tối ưu cho RTX 3050 4GB VRAM
  lr:           3.0e-4
  gamma:        0.99              # hệ số chiết khấu
  buffer_cap:   100000            # dung lượng Replay Buffer
  eps_start:    1.0               # epsilon ban đầu (ε-greedy)
  eps_min:      0.05              # epsilon tối thiểu
  eps_decay:    30000             # số bước suy giảm epsilon
  use_per:      false             # Prioritized Experience Replay
  save_every:   100               # lưu checkpoint mỗi N episodes
  eval_every:   50                # chạy eval greedy mỗi N episodes

# --- Cấu hình đánh giá ---
eval:
  n_episodes:   20                # số tập thử nghiệm mỗi chiến lược
  hidden_dim:   256               # phải khớp với lúc train
  seed:         100               # seed riêng cho eval (tách biệt với train)
